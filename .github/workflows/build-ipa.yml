
name: Build Dynor IPA (unsigned)

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: 'ZIP source filename in repository'
        required: true
        default: 'Dynor-IOS-source.zip'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source ZIP
        env:
          SOURCE_ZIP: ${{ inputs.source_zip }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, zipfile
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          name = os.environ['SOURCE_ZIP']
          archive = (root / name).resolve()
          if not archive.is_relative_to(root) or not archive.is_file() or archive.suffix.lower() != '.zip':
              raise SystemExit('Source ZIP not found in repository: ' + name)
          dest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'dynor-source'
          dest.mkdir()
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  p = pathlib.PurePosixPath(info.filename)
                  if p.is_absolute() or '..' in p.parts or info.file_size > 200_000_000:
                      raise SystemExit('Unsafe ZIP entry: ' + info.filename)
                  target = dest.joinpath(*p.parts)
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(info) as src, target.open('wb') as out:
                          import shutil
                          shutil.copyfileobj(src, out)
          projects = [p.parent for p in dest.rglob('project.yml') if (p.parent / 'Dynor').is_dir() and (p.parent / 'scripts/build_ipa.sh').is_file()]
          if len(projects) != 1:
              raise SystemExit('Expected exactly one Dynor project.yml and scripts/build_ipa.sh')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SOURCE_DIR=' + str(projects[0]) + '\n')
          PY

      - name: Install XcodeGen
        run: |
          xcodebuild -version
          command -v xcodegen || brew install xcodegen

      - name: Build unsigned IPA
        run: bash "$SOURCE_DIR/scripts/build_ipa.sh" --skip-tests

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Dynor-unsigned-IPA
          path: ${{ env.SOURCE_DIR }}/build/ipa/Dynor-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Dynor-build-logs
          path: ${{ env.SOURCE_DIR }}/build/logs/
          if-no-files-found: ignore
